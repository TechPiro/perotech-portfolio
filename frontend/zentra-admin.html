<!DOCTYPE html>
<html lang="en">

<head>
    <meta charSet="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <link rel="icon" href="assets/img/favicon-large.png" type="image/png" />
    <title>Zentra — Content Manager</title>
    <style>
        :root { --blue: #2f80ed; --navy: #0b0f1a; --card: #141a28; --border: #232b3d; --ink: #e8ecf5; --muted: #96a0b5; }
        * { box-sizing: border-box; }
        body { margin: 0; background: #0a0e1a; color: var(--ink); font-family: Inter, -apple-system, "Segoe UI", Roboto, sans-serif; line-height: 1.5; }
        a { color: var(--blue); }
        .za-top { position: sticky; top: 0; z-index: 20; display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 14px 22px; background: rgba(11, 15, 26, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border); }
        .za-top h1 { font-size: 1.05rem; margin: 0; font-weight: 800; }
        .za-top h1 b { color: var(--blue); }
        .za-actions { display: flex; gap: 10px; align-items: center; }
        .za-wrap { max-width: 940px; margin: 0 auto; padding: 26px 22px 120px; }
        .btn { font: inherit; font-weight: 700; border: 1px solid transparent; border-radius: 10px; padding: 10px 18px; cursor: pointer; background: #202838; color: var(--ink); transition: .15s; }
        .btn:hover { background: #2a3345; }
        .btn.primary { background: var(--blue); color: #fff; }
        .btn.primary:hover { background: #3a8bf5; }
        .btn.sm { padding: 6px 12px; font-size: .85rem; border-radius: 8px; }
        .btn.danger { background: #3a1720; color: #ff8a9c; }
        .btn.ghost { background: transparent; border-color: var(--border); }
        .za-sec { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px; margin-bottom: 18px; }
        .za-sec > h2 { font-size: 1.06rem; margin: 0 0 4px; }
        .za-sec > .hint { color: var(--muted); font-size: .85rem; margin: 0 0 16px; }
        label.fld { display: block; margin-bottom: 14px; }
        label.fld span { display: block; font-size: .8rem; font-weight: 600; color: var(--muted); margin-bottom: 5px; }
        input[type=text], input[type=url], textarea, select { width: 100%; background: #0e1420; border: 1px solid var(--border); border-radius: 9px; color: var(--ink); font: inherit; padding: 10px 12px; }
        textarea { min-height: 84px; resize: vertical; }
        .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 0 16px; }
        .z-row { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: start; border: 1px solid var(--border); border-radius: 12px; padding: 12px; margin-bottom: 10px; background: #0e1420; }
        .z-row .z-fields { display: grid; gap: 8px; }
        .z-row .z-ctrls { display: flex; flex-direction: column; gap: 6px; }
        .z-row .z-ctrls .btn { padding: 5px 9px; font-size: .8rem; }
        .toggle { display: inline-flex; align-items: center; gap: 8px; cursor: pointer; font-size: .9rem; }
        .toggle input { width: 18px; height: 18px; }
        .img-field { display: flex; gap: 8px; align-items: center; }
        .img-field input { flex: 1; }
        .thumb { width: 54px; height: 40px; object-fit: cover; border-radius: 6px; border: 1px solid var(--border); background: #000; }
        .toast { position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%) translateY(20px); background: #16324f; color: #cfe4ff; border: 1px solid #2f6bb0; padding: 12px 20px; border-radius: 10px; opacity: 0; transition: .25s; z-index: 50; }
        .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }
        .toast.err { background: #3a1720; color: #ff9caa; border-color: #7a2b3a; }
        .savebar { position: fixed; bottom: 0; left: 0; right: 0; z-index: 30; display: flex; justify-content: center; gap: 12px; padding: 14px; background: linear-gradient(180deg, transparent, #0a0e1a 40%); }
        .icons-help { font-size: .78rem; color: var(--muted); background: #0e1420; border: 1px dashed var(--border); border-radius: 8px; padding: 8px 12px; margin-bottom: 14px; }
        .icons-help code { color: #8fd0ff; }
        /* login */
        .login { max-width: 360px; margin: 12vh auto; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 30px; }
        .login h1 { margin: 0 0 4px; font-size: 1.2rem; }
        .login p { color: var(--muted); font-size: .88rem; margin: 0 0 18px; }
        .login .btn { width: 100%; margin-top: 6px; }
        .login .err { color: #ff9caa; font-size: .85rem; min-height: 18px; margin-top: 8px; }
        @media (max-width:640px){ .grid2 { grid-template-columns: 1fr; } }
    </style>
</head>

<body>
    <div id="app"><div style="padding:40px;text-align:center;color:#96a0b5">Loading…</div></div>
    <div class="toast" id="toast"></div>
    <script src="assets/js/zentra-admin.js"></script>
</body>

</html>
