<!DOCTYPE html>
<html lang="en">

<head>
    <meta charSet="utf-8" />
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="assets/img/favicon-large.png" type="image/png" />
    <link rel="stylesheet" href="_next/static/css/6cab9c8daf531c56.css" data-precedence="next" />
    <link rel="stylesheet" href="_next/static/css/e05db15794235b2c.css" data-precedence="next" />
    <link rel="stylesheet" href="_next/static/css/b9561bab1231773f.css" data-precedence="next" />
    <link rel="stylesheet" href="_next/static/css/8b5794fe96c96e12.css" data-precedence="next" />
    <link rel="stylesheet" href="assets/css/mobile-fixes.css" />
    <link rel="stylesheet" href="assets/css/icon-fixes.css" />
    <link rel="stylesheet" href="assets/css/learn.css" />
    <title>PeroTech — My Profile</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
</head>

<body class="dark-theme">
    <div>
        <header class="header-area">
            <nav class="navbar">
                <div class="container">
                    <div class="menu-container">
                        <div class="logo"><a class="navbar-brand me-0" href="/"><img src="assets/img/logo/logo-text.webp" alt="logo" /></a></div>
                        <div class="navbar-main d-flex flex-grow-1 ">
                            <div class="logo inner-logo d-block d-xl-none"><a class="navbar-brand me-0" href="/"><img src="assets/img/logo/logo-text.webp" alt="logo" /></a></div>
                            <ul class="navbar-info mx-auto d-xl-flex gap-1">
                                <li class="nav-item"><a class="nav-link" href="/"><img src="assets/img/icons/home.svg" class="svg nav-icon" alt="" /><span>Home</span></a></li>
                                <li class="nav-item"><a class="nav-link" href="/blog"><img src="assets/img/icons/blog.svg" class="svg nav-icon" alt="" /><span>Blog</span></a></li>
                                <li class="nav-item"><a class="nav-link active" href="/learn"><img src="assets/img/icons/portfolio.svg" class="svg nav-icon" alt="" /><span>Learn</span></a></li>
                            </ul>
                            <div class="header-right-info d-flex align-items-center"><a class="lets-talk-btn" href="/learn">Browse courses</a></div>
                        </div>
                        <div class="mobile-menu-overlay d-block d-lg-none "></div>
                        <div class="mobile-menu-control-bar d-block d-xl-none"><button class="mobile-menu-control-bar"><i class="fas fa-bars"></i></button></div>
                    </div>
                </div>
            </nav>
        </header>
        <main>
            <section class="content-box-area mt-4">
                <div class="learn-wrap">
                    <div class="learn-authbar" id="learn-authbar"></div>
                    <div class="profile-wrap" id="profile-root">
                        <div class="learn-empty">Loading your profile…</div>
                    </div>
                </div>
            </section>
        </main>
    </div>

    <script src="assets/js/mobile-menu.js"></script>
    <script src="assets/js/inline-svg.js"></script>
    <script src="assets/js/student-session.js"></script>
    <script>
        (function () {
            if (!PT.token()) { location.href = "/student-login?next=/student-profile"; return; }
            PT.renderAuthBar(document.getElementById("learn-authbar"));
            PT.renderBottomNav("profile");

            const esc = (s) => String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
            const root = document.getElementById("profile-root");
            const email = PT.email();
            const name = PT.name() || email.split("@")[0] || "Student";
            const initial = (name.trim()[0] || "S").toUpperCase();

            const render = (stats) => {
                const owned = stats ? stats.owned : 0;
                const access = stats && stats.allAccess ? "All-access pass" : (owned > 0 ? "Per-course access" : "No courses yet");
                root.innerHTML = `
                    <div class="profile-hero">
                        <div class="profile-av">${esc(initial)}</div>
                        <div class="profile-id">
                            <h1>${esc(name)}</h1>
                            <p class="pid-email">${esc(email)}</p>
                            <span class="pid-badge">🎓 ${esc(access)}</span>
                        </div>
                    </div>

                    <a class="profile-cta" href="/learn-dashboard">▶ Continue learning</a>

                    <div class="profile-section">
                        <h3>Learning</h3>
                        <div class="p-row"><span class="p-label">Courses enrolled</span><span class="p-val">${owned}</span></div>
                        <div class="p-row"><span class="p-label">Access type</span><span class="p-val">${esc(access)}</span></div>
                    </div>

                    <div class="profile-section">
                        <h3>Account</h3>
                        <div class="p-row"><span class="p-label">Name</span><span class="p-val">${esc(name)}</span></div>
                        <div class="p-row"><span class="p-label">Email</span><span class="p-val">${esc(email)}</span></div>
                        <div class="p-row"><span class="p-label">Sign-in</span><span class="p-val">Passwordless (magic link)</span></div>
                    </div>

                    <button class="p-signout" id="p-signout">Sign out</button>`;

                document.getElementById("p-signout").addEventListener("click", () => { PT.clear(); location.href = "/learn"; });
            };

            // Pull live stats (course count + all-access) for the profile.
            fetch("/api/student/my-courses", { headers: PT.authHeaders() })
                .then((r) => { if (r.status === 401) { PT.clear(); location.href = "/student-login?next=/student-profile"; throw new Error("auth"); } return r.json(); })
                .then((d) => render({ owned: (d.courses || []).length, allAccess: !!d.allAccess }))
                .catch((e) => { if (e.message !== "auth") render(null); });
        })();
    </script>
</body>

</html>
